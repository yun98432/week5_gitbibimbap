name: ✨ 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안합니다
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제 (배경)
      description: "어떤 불편이 있는지 적어주세요. 해결 방법은 아래에 적습니다."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 완료 조건
      description: 이 조건을 모두 만족하면 이슈를 닫을 수 있도록 구체적으로 적어주세요.
      placeholder: |
        - [ ] 단어 검색 시 대소문자를 구분하지 않는다
        - [ ] 검색 결과가 없으면 안내 문구를 표시한다
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항 (선택)
      description: 구현 아이디어, 관련 이슈 번호 등